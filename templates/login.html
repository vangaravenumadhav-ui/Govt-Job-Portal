<!DOCTYPE html>
<html>

<head>

    <title>Govt Job Portal - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Login</h1>

            <form action="/login" method="POST">

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</body>

</html>
