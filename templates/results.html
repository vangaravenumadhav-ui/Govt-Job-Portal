<!DOCTYPE html>
<html>

<head>

    <title>Results</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>AI Recommended Jobs</h1>

        {% for job in jobs %}

        <div class="card">

            <h2>{{ job }}</h2>

            <a href="/roadmap/{{ job }}">
                <button>View Roadmap</button>
            </a>

        </div>

        {% endfor %}

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
