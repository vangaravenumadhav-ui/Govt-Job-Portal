<!DOCTYPE html>
<html>
<head>
    <title>AI Recommended Jobs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="jobs-container">

    <h1>🤖 AI Recommended Jobs</h1>

    {% for job in jobs %}

    <div class="job-card">

        <h2>{{ job.title }}</h2>

        <a href="{{ job.link }}" target="_blank">
            Apply Now
        </a>

        <br><br>

        <a href="/roadmap/{{ job.title }}">
            View Roadmap
        </a>

    </div>

    {% endfor %}

    <br>

    <a class="live-btn" href="/livejobs">
        🌐 View Live Govt Jobs
    </a>

</div>

</body>
</html>
