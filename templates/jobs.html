<!DOCTYPE html>
<html>

<head>

    <title>AI Recommended Jobs</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>AI Recommended Jobs</h1>

        <form method="POST">

            <input type="text"
                   name="branch"
                   placeholder="Enter Your Branch">

            <button type="submit">
                Get Jobs
            </button>

        </form>

        {% for job in jobs %}

<div class="job-card">

    <h2>{{ job.title }}</h2>

    <a href="/roadmap/{{ job.title }}">
        <button>
            View Roadmap
        </button>
    </a>

    <a href="{{ job.apply_link }}" target="_blank">
        <button>
            Apply Job
        </button>
    </a>

</div>

{% endfor %}

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
